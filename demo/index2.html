
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PHP-WASM - Test de Rendimiento y Concurrencia</title>
    <style>
        :root {
            --background: #f8f9fa;
            --foreground: #212529;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --primary: #007bff;
            --primary-hover: #0056b3;
            --primary-disabled: #80bfff;
            --primary-foreground: #ffffff;
            --success: #28a745;
            --danger: #dc3545;
            --muted-fg: #6c757d;
            --input-bg: #ffffff;
            --input-border: #ced4da;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            --radius: 8px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #121212;
                --foreground: #e0e0e0;
                --card-bg: #1e1e1e;
                --border-color: #333;
                --primary: #4dabf7;
                --primary-hover: #74c0fc;
                --primary-disabled: #224;
                --primary-foreground: #121212;
                --success: #40c057;
                --danger: #fa5252;
                --muted-fg: #888;
                --input-bg: #2a2a2a;
                --input-border: #444;
            }
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            margin: 0;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            font-weight: 600;
            margin: 0.5rem 0 1rem 0;
            color: var(--primary);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: all 0.2s ease-in-out;
        }

        .card h2 { margin: 0 0 1rem 0; font-size: 1.25rem; }

        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        .form-input {
            width: 100%;
            padding: 0.75rem;
            border-radius: var(--radius);
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--foreground);
            font-size: 1rem;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--primary-foreground);
        }
        .btn-primary:hover:not(:disabled) { background-color: var(--primary-hover); }
        .btn:disabled {
            background-color: var(--primary-disabled);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .status-badge {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius);
            font-weight: 600;
        }
        .status-initializing { background-color: #ffc107; color: #333; }
        .status-ready { background-color: var(--success); color: var(--primary-foreground); }
        .status-error { background-color: var(--danger); color: var(--primary-foreground); }

        #summary-card { display: none; }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            text-align: center;
        }
        .summary-item strong { display: block; font-size: 1.5rem; }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            margin: 1rem 0;
        }
        .progress-bar-inner {
            width: 0;
            height: 100%;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }

        #results-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }
        .result-card {
            padding: 1rem;
            border-left-width: 5px;
            border-left-style: solid;
        }
        .result-card.success { border-left-color: var(--success); }
        .result-card.error { border-left-color: var(--danger); }
        .result-card h3 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            margin: 0 0 0.75rem 0;
        }
        .result-card .time-badge {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            background-color: var(--muted-fg);
            color: var(--card-bg);
        }
        .result-card.success .time-badge { background-color: var(--success); }
        .result-card.error .time-badge { background-color: var(--danger); }
        .result-card pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.8rem;
            max-height: 150px;
            overflow-y: auto;
            background-color: var(--background);
            padding: 0.5rem;
            border-radius: 4px;
        }

        @media (max-width: 600px) {
            body { padding: 0.5rem; }
            .container { gap: 1rem; }
            h1 { font-size: 1.5rem; }
            .card { padding: 1rem; }
            .summary-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PHP-WASM Performance Test</h1>

        <div class="card">
            <h2>Estado del Entorno</h2>
            <p>
                PHP Runtime: 
                <span id="status-badge" class="status-badge status-initializing">Inicializando...</span>
            </p>
            <p id="init-time-p" style="display: none;">
                Tiempo de inicialización: <strong id="init-time"></strong>
            </p>
        </div>

        <div class="card">
            <h2>Configuración de la Prueba</h2>
            <div class="form-group">
                <label class="form-label" for="concurrency-input">Solicitudes Concurrentes</label>
                <input class="form-input" type="number" id="concurrency-input" value="4" min="1" max="100">
            </div>
            <button class="btn btn-primary" id="start-test-btn" disabled>Iniciar Prueba</button>
        </div>

        <div class="card" id="summary-card">
            <h2>Resultados</h2>
            <div class="progress-bar">
                <div class="progress-bar-inner" id="progress-bar-inner"></div>
            </div>
            <div class="summary-grid">
                <div class="summary-item" id="total-time"><strong class="text-primary"></strong><span>Tiempo Total</span></div>
                <div class="summary-item" id="avg-time"><strong class="text-primary"></strong><span>Tiempo Medio / Req.</span></div>
                <div class="summary-item" id="successful-requests"><strong class="text-success"></strong><span>Éxitos</span></div>
                <div class="summary-item" id="failed-requests"><strong class="text-error"></strong><span>Fallos</span></div>
            </div>
        </div>

        <div id="results-container"></div>
    </div>

    <script src="/src/php_runtime.js" type="module"></script>
    <script type="module">
        const concurrencyInput = document.getElementById('concurrency-input');
        const startTestBtn = document.getElementById('start-test-btn');
        const resultsContainer = document.getElementById('results-container');
        const summaryCard = document.getElementById('summary-card');
        
        const statusBadge = document.getElementById('status-badge');
        const initTimeP = document.getElementById('init-time-p');
        const initTimeEl = document.getElementById('init-time');

        const totalTimeEl = document.querySelector('#total-time strong');
        const avgTimeEl = document.querySelector('#avg-time strong');
        const successfulRequestsEl = document.querySelector('#successful-requests strong');
        const failedRequestsEl = document.querySelector('#failed-requests strong');
        const progressBar = document.getElementById('progress-bar-inner');

        async function initializePHP() {
            const initStartTime = performance.now();
            try {
                console.log('Initializing PHP runtime...');
                await runPHP.init({
                    DEBUG: false,
                    NUM_WORKERS: 4,
                    TIMEOUT_WORKER: 60000,
                    DOCUMENT_ROOT: "/www",
                    ENTRY_POINT: "/www/public/index.php",
                });
                const initEndTime = performance.now();
                
                statusBadge.textContent = 'Listo';
                statusBadge.className = 'status-badge status-ready';
                initTimeEl.textContent = `${Math.round(initEndTime - initStartTime)} ms`;
                initTimeP.style.display = 'block';

                startTestBtn.disabled = false;
                console.log('PHP runtime initialized.');
            } catch (error) {
                statusBadge.textContent = 'Error';
                statusBadge.className = 'status-badge status-error';
                console.error('Error initializing PHP runtime:', error);
                alert('Failed to initialize PHP runtime. Check console for details.');
            }
        }
        
        initializePHP();

        startTestBtn.addEventListener('click', async () => {
            const concurrency = parseInt(concurrencyInput.value, 10);
            if (isNaN(concurrency) || concurrency <= 0) {
                alert('Por favor, introduce un número válido de solicitudes.');
                return;
            }

            resultsContainer.innerHTML = '';
            summaryCard.style.display = 'block';
            startTestBtn.disabled = true;
            startTestBtn.textContent = 'Ejecutando...';
            progressBar.style.width = '0%';
            
            let completedRequests = 0;

            const requestPromises = Array.from({ length: concurrency }, (_, i) => {
                const reqStartTime = performance.now();
                return runPHP.request({
                    method: 'GET',
                    query: '/api/posts',
                }).then(result => {
                    const reqTime = performance.now() - reqStartTime;
                    completedRequests++;
                    progressBar.style.width = `${(completedRequests / concurrency) * 100}%`;
                    return { status: 'success', result, index: i, time: reqTime };
                }).catch(error => {
                    const reqTime = performance.now() - reqStartTime;
                    completedRequests++;
                    progressBar.style.width = `${(completedRequests / concurrency) * 100}%`;
                    return { status: 'error', error, index: i, time: reqTime };
                });
            });

            const startTime = performance.now();
            const results = await Promise.all(requestPromises);
            const endTime = performance.now();

            let successfulCount = 0;
            let failedCount = 0;
            
            results.sort((a, b) => a.index - b.index).forEach(result => {
                const card = document.createElement('div');
                card.className = 'card result-card';
                const title = document.createElement('h3');
                const timeBadge = document.createElement('span');
                timeBadge.className = 'time-badge';
                timeBadge.textContent = `${Math.round(result.time)} ms`;
                title.textContent = `Solicitud #${result.index + 1}`;
                title.appendChild(timeBadge);
                
                const content = document.createElement('pre');

                if (result.status === 'success') {
                    card.classList.add('success');
                    content.textContent = result.result;
                    successfulCount++;
                } else {
                    card.classList.add('error');
                    content.textContent = result.error.message;
                    failedCount++;
                }
                card.appendChild(title);
                card.appendChild(content);
                resultsContainer.appendChild(card);
            });

            const totalTime = endTime - startTime;
            totalTimeEl.textContent = `${Math.round(totalTime)} ms`;
            avgTimeEl.textContent = `${Math.round(totalTime / concurrency)} ms`;
            successfulRequestsEl.textContent = successfulCount;
            failedRequestsEl.textContent = failedCount;
            
            startTestBtn.disabled = false;
            startTestBtn.textContent = 'Iniciar Prueba';
        });

    </script>
</body>
</html>
