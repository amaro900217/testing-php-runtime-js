<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PHP WASM LOCAL API Tests</title>

        <!-- ========== ESTILOS IGUAL QUE LA PRIMERA PÁGINA ========== -->
        <style>
            /* ---------- variables automáticas claro/oscuro ---------- */
            :root {
                --bg: #fafafa;
                --fg: #333;
                --card: #ffffff;
                --border: #ccc;
                --input-bg: #ffffff;
                --input-fg: #111;
                --input-border: #f5f5f5;
                --btn-bg: #000;
                --btn-fg: #fff;
                --btn2-bg: #555;
                --th-bg: #f5f5f5;
                --spinner-bg: #fff;
                --spinner-circle: #ddd;
                --spinner-top: #000;
                --spinner-text: #111;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #121212;
                    --fg: #e0e0e0;
                    --card: #1e1e1e;
                    --border: #333;
                    --input-bg: #1e1e1e;
                    --input-fg: #e0e0e0;
                    --input-border: #333;
                    --btn-bg: #e0e0e0;
                    --btn-fg: #121212;
                    --btn2-bg: #aaa;
                    --th-bg: #2a2a2a;
                    --spinner-bg: #121212;
                    --spinner-circle: #444;
                    --spinner-top: var(--btn-bg);
                    --spinner-text: var(--fg);
                }
            }

            /* ---------- base (igual que el CRUD) ---------- */
            body {
                font-family: system-ui, sans-serif;
                margin: 16px;
                margin-top: 0;
                max-width: 800px;
                margin-left: auto;
                margin-right: auto;
                background: var(--bg);
                color: var(--fg);
            }
            h1,
            h3 {
                text-align: center;
                margin-top: 0;
            }
            button {
                padding: 0.65rem;
                font-size: 1rem;
                border: none;
                border-radius: 6px;
                background: var(--btn-bg);
                color: var(--btn-fg);
                cursor: pointer;
                flex: 1 1 auto;
            }
            button[type="button"] {
                background: var(--btn2-bg);
            }
            button:hover {
                opacity: 0.9;
            }
            #body-container {
                padding: 1.5rem;
            }
            .cards-container {
                display: flex;
                gap: 1rem;
                margin-bottom: 1rem;
            }
            .card {
                background: var(--th-bg);
                flex: 1;
                padding: 1.2rem;
                border-radius: 6px;
                text-align: center;
            }
            pre {
                background: var(--card);
                border: 1px solid var(--border);
                padding: 1rem;
                border-radius: 6px;
                overflow-x: auto;
                text-align: left;
                white-space: pre-wrap;
                word-break: break-word;
            }

            /* ---------- spinner idéntico ---------- */
            #spinner {
                position: fixed;
                inset: 0;
                background: var(--spinner-bg);
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                gap: 16px;
                font-size: 1.2rem;
                z-index: 9999;
                color: var(--spinner-text);
                transition: opacity 0.5s ease;
            }
            #spinner.hidden {
                opacity: 0;
                pointer-events: none;
            }
            .spinner-circle {
                width: 64px;
                height: 64px;
                border: 6px solid var(--spinner-circle);
                border-top-color: var(--spinner-top);
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .spinner-text {
                font-weight: 500;
                letter-spacing: 0.5px;
            }
        </style>
    </head>

    <body>
        <!-- ========== CONTENIDO CON ESTILO UNIFICADO ========== -->
        <div id="body-container">
            <div class="cards-container">
                <div class="card">
                    <h1>PHP WASM<br />Local API Tests</h1>
                    <div class="timer">
                        <div id="timerValue" class="timer-value">0 ms</div>
                        <div id="timerStatus" class="timer-status">
                            Inicializando...
                        </div>
                    </div>
                    <div class="buttons">
                        <button id="btnRefresh">Refrescar Página</button>
                        <button id="btnGetPosts">Run GET /api/posts</button>
                        <button id="btnInline">Run Inline PHP</button>
                        <button id="btnGet1">Run GET /script_1.php</button>
                        <button id="btnGet2">Run GET /server_info.php</button>
                        <button id="btnPost">Run POST /process.php</button>
                    </div>
                    <h3>Output</h3>
                    <pre id="output">Inicializando PHP Runtime...</pre>
                </div>
            </div>
        </div>

        <!-- ========== LÓGICA ORIGINAL (SIN TOCAR) ========== -->
        <script>
            window.pageStartTime = performance.now();
            window.timerInterval = null;
            function updateTimer() {
                const elapsed = performance.now() - window.pageStartTime;
                document.getElementById("timerValue").textContent =
                    `${Math.round(elapsed)} ms`;
            }
            window.timerInterval = setInterval(updateTimer, 50);
            function stopTimer(message) {
                clearInterval(window.timerInterval);
                document.getElementById("timerStatus").textContent = message;
            }
        </script>

        <!-- ========== PHP-WASM (RUTA ORIGINAL) ========== -->
        <script src="php_runtime.js" type="module"></script>
        <script type="module">
            const outputEl = document.getElementById("output");
            function logOutput(label, text) {
                console.log(label, text);
                outputEl.textContent += `\n=== ${label} ===\n${text}\n`;
                outputEl.scrollTop = outputEl.scrollHeight;
            }
            try {
                document.getElementById("timerStatus").textContent =
                    "Configurando PHP Runtime...";
                await runPHP.init({
                    DEBUG: true,
                    NUM_WORKERS: 4,
                    TIMEOUT_WORKER: 60000,
                    DOCUMENT_ROOT: "/www",
                    ENTRY_POINT: "/www/php_api/LARAVEL_API/public/index.php",
                    SERVER_ADDR: "127.0.0.1",
                    SERVER_NAME: "browser-localhost",
                    SERVER_SOFTWARE: "wasm-server-0.0.8",
                    SERVER_PORT: "8080",
                });
                document.getElementById("timerStatus").textContent =
                    "Ejecutando petición GET automática...";
                const autoResult = await runPHP.request({
                    method: "GET",
                    query: "/api/posts",
                    payload: "",
                    headers: "",
                });
                logOutput("AUTO GET LARAVEL /api/posts", autoResult);
                const totalTime = Math.round(
                    performance.now() - window.pageStartTime,
                );
                stopTimer(`¡Completado! Total: ${totalTime} ms`);
            } catch (error) {
                logOutput(
                    "ERROR",
                    `Error durante la inicialización: ${error.message}`,
                );
                stopTimer(`Error: ${error.message}`);
            }
        </script>

        <!-- ========== BOTONES (IGUAL QUE ANTES) ========== -->
        <script>
            document.getElementById("btnGetPosts").onclick = async () => {
                const start = performance.now();
                try {
                    const result = await runPHP.request({
                        method: "GET",
                        query: "/api/posts",
                        payload: "",
                        headers: "",
                    });
                    const time = Math.round(performance.now() - start);
                    logOutput(`GET /api/posts (${time}ms)`, result);
                    alert(
                        `GET /api/posts completado en ${time} ms\n\nRespuesta:\n${result}`,
                    );
                } catch (error) {
                    logOutput("ERROR GET /api/posts", error.message);
                    alert(`ERROR GET /api/posts:\n${error.message}`);
                }
            };
            document.getElementById("btnRefresh").onclick = () =>
                location.reload();
            document.getElementById("btnInline").onclick = async () => {
                const start = performance.now();
                try {
                    const result = await runPHP.inline(
                        '<?php echo "Hola desde Inline PHP - " . date("Y-m-d H:i:s"); ?>',
                    );
                    const time = Math.round(performance.now() - start);
                    logOutput(`Inline PHP (${time}ms)`, result);
                } catch (error) {
                    logOutput("ERROR Inline", error.message);
                }
            };
            document.getElementById("btnGet1").onclick = async () => {
                const start = performance.now();
                try {
                    const result = await runPHP.request({
                        method: "GET",
                        query: "/www/php_api/LARAVEL_API/script_1.php",
                        payload: "",
                        headers: "",
                    });
                    const time = Math.round(performance.now() - start);
                    logOutput(`GET /script_1.php (${time}ms)`, result);
                } catch (error) {
                    logOutput("ERROR GET1", error.message);
                }
            };
            document.getElementById("btnGet2").onclick = async () => {
                const start = performance.now();
                try {
                    const result = await runPHP.request({
                        method: "GET",
                        query: "/www/php_api/LARAVEL_API/server_info.php",
                        payload: "",
                        headers: "",
                    });
                    const time = Math.round(performance.now() - start);
                    logOutput(`GET /server_info.php (${time}ms)`, result);
                } catch (error) {
                    logOutput("ERROR GET2", error.message);
                }
            };
            document.getElementById("btnPost").onclick = async () => {
                const start = performance.now();
                try {
                    const result = await runPHP.request({
                        method: "POST",
                        query: "/www/php_api/LARAVEL_API/process.php",
                        payload: "x=42&y=99",
                        headers:
                            "Content-Type: application/x-www-form-urlencoded",
                    });
                    const time = Math.round(performance.now() - start);
                    logOutput(`POST /process.php (${time}ms)`, result);
                } catch (error) {
                    logOutput("ERROR POST", error.message);
                }
            };
        </script>
    </body>
</html>
